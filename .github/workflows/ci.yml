name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch llm-offload (pinned, read-only)
        run: sh scripts/fetch-llm-offload.sh
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Demo (replay mode, no key, no model)
        run: python -m bench demo --live
      - name: Rescore recorded outputs and compare with committed results
        run: python -m bench.report --check
